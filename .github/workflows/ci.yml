name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled so adding the override label re-runs the gate
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make test

  api-drift:
    name: "API contract: committed spec matches code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make drift

  api-breaking:
    name: "API contract: no breaking changes"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky changelog comment
    env:
      BASE_REF: origin/${{ github.base_ref }}
      OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-change-approved') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base branch's committed specs
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make tools # pinned oasdiff -> .bin/

      - name: Breaking-change and lifecycle gate
        run: |
          args=(--base "$BASE_REF")
          if [ "$OVERRIDE" = "true" ]; then
            echo "::warning::'api-breaking-change-approved' label present: breaking changes reported but not blocking"
            args+=(--allow-breaking)
          fi
          uv run python tools/api_contract.py breaking "${args[@]}"

      - name: Post API changelog to the PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          uv run python tools/api_contract.py changelog --base "$BASE_REF" > changelog.md
          cat changelog.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body-file changelog.md --edit-last --create-if-none
